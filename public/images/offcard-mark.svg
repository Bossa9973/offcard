<svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="lumen-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2F2C6"/>
      <stop offset="50%" stop-color="#F8F8F8"/>
      <stop offset="100%" stop-color="#DFE1F8"/>
    </linearGradient>
  </defs>
  <!-- Ring built from vertical bars, cut diagonally with offset -->
  <g fill="url(#lumen-grad)">
    <!-- Top-left half -->
    <rect x="8" y="18" width="4" height="12" rx="2" />
    <rect x="14" y="12" width="4" height="20" rx="2" />
    <rect x="20" y="8" width="4" height="20" rx="2" />
    <rect x="26" y="8" width="4" height="14" rx="2" />
    <!-- Bottom-right half (offset diagonally) -->
    <rect x="20" y="28" width="4" height="12" rx="2" />
    <rect x="26" y="24" width="4" height="18" rx="2" />
    <rect x="32" y="16" width="4" height="20" rx="2" />
    <rect x="38" y="20" width="4" height="12" rx="2" />
  </g>
</svg>
